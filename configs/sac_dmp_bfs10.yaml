runner: rl

seed: null

env:
  xml_path: go2/scene.xml
  control_substeps: 4
  kp: 80.0
  kd: 4.0
  initial_base_height: 0.30
  initial_angles: [0.0303, 1.54, -2.3, 0.0303, 1.54, -2.3, 0.0365, 1.48, -2.39, 0.0365, 1.48, -2.39]
  settle_steps: 1000

reward:
  reward_fn: forward
  termination_fn: crawl
  reward_forward_weight: 1000.0
  reward_lateral_weight: -500.0
  reward_joint_vel_weight: -0.0002
  min_height: 0.14
  max_height: 0.20
  max_abs_roll_deg: 50.0
  max_abs_pitch_deg: 50.0
  fall_penalty: 25.0

policy:
  csv_path: data/new_dataset_v1.csv
  dmp_params_path: data/weights/dmp_params_newV1_bfs10.npz
  n_components: 2
  n_bfs: 10
  dmp_timesteps: 628

agent:
  type: sac_dmp
  initial_weights_path: data/weights/initial_dmp_weights_newV1_bfs10.npy
  action_scale: 10.0
  reward_scale: 1.0
   # action_range: 2.0                   # search range: initial_weights ± this value
  learning_rate: 3.0e-4
  batch_size: 64
  buffer_size: 5000
  learning_starts: 20
  tau: 0.005
  gamma: 0.99
  ent_coef: auto
  target_entropy: -4   # change to auto.
  gradient_steps: 4
  net_arch: [256, 256]
  seed: null
  device: auto

training:
  total_episodes: 7000
  sim_steps: 1000
  logdir: results/sac_dmp_bfs10
  n_workers: 1
  checkpoint_every: 50
  log_every: 10