runner: props

env:
  xml_path: /Volumes/DEV/IRL/Go2_crawl/go2/scene.xml
  control_substeps: 4
  kp: 80.0
  kd: 4.0
  initial_base_height: 0.30
  initial_angles: [0.0303, 1.54, -2.3, 0.0303, 1.54, -2.3, 0.0365, 1.48, -2.39, 0.0365, 1.48, -2.39]
  settle_steps: 1000

reward:
  reward_fn: forward
  termination_fn: crawl
  reward_forward_weight: 1000.0
  reward_lateral_weight: -500.0
  reward_joint_vel_weight: -0.0002
  min_height: 0.14
  max_height: 0.20
  max_abs_roll_deg: 50.0
  max_abs_pitch_deg: 50.0
  fall_penalty: 25.0

policy:
  csv_path: /Volumes/DEV/IRL/Go2_crawl/dataset/new_dataset_v1.csv
  dmp_params_path: data/weights/dmp_params_newV1_bfs10.npz
  n_components: 2
  n_bfs: 10
  dmp_timesteps: 628

agent:
  type: props_dmp
  initial_weights_path: data/weights/initial_dmp_weights_newV1_bfs10.npy
  action_range: 2.0

  # LLM settings — Ollama on Sol
  llm_model_name: gpt-oss:120b           # model loaded in Ollama
  llm_provider: ollama                    # must be set explicitly for Ollama
  ollama_base_url: http://sg017:11434/api/chat  # REPLACE with actual Sol URL

  template_dir: templates
  template_name: props_semantic.j2        # ProPS+ (with environment description)
  env_description_file: go2_crawl_description.j2

  # Optimization settings
  feedback_mode: basic
  objective: cost
  buffer_size: 200
  warmup_episodes: 10
  optimum: null
  step_size: 0.1

  # API settings — longer retry delay for Sol (network latency + large model)
  max_retries: 5
  retry_delay: 120
  max_parse_retries: 3

training:
  total_iterations: 400
  sim_steps: 1000
  logdir: results/propsp_ollama_bfs10
  n_workers: 1vscode-remote://tunnel%2Bsol_jboyapat/home/jboyapat/Props_dog/Go2_crawl/refactor/results
  checkpoint_every: 50
  log_every: 1