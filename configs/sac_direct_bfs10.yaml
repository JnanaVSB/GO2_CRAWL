runner: rl

seed: null

trajectory:
  type: direct_dmp

env:
  xml_path: go2/scene.xml
  control_substeps: 4
  kp: 80.0
  kd: 4.0
  initial_base_height: 0.30
  initial_angles: [0.0303, 1.54, -2.3, 0.0303, 1.54, -2.3, 0.0365, 1.48, -2.39, 0.0365, 1.48, -2.39]
  settle_steps: 1000

reward:
  reward_fn: forward
  termination_fn: crawl
  reward_forward_weight: 1000.0
  reward_lateral_weight: -500.0
  reward_joint_vel_weight: -0.0002
  min_height: 0.14
  max_height: 0.20
  max_abs_roll_deg: 50.0
  max_abs_pitch_deg: 50.0
  fall_penalty: 25.0

policy:
  csv_path: data/new_dataset_v1.csv
  dmp_params_path: data/weights/direct_dmp_params_bfs10.npz
  n_bfs: 10
  n_joints: 12
  dmp_timesteps: 628

agent:
  type: sac_dmp
  initial_weights_path: data/weights/direct_dmp_weights_bfs10.npy
  action_range: 2.0
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 10000
  learning_starts: 100
  tau: 0.005
  gamma: 0.99
  ent_coef: auto
  target_entropy: auto
  gradient_steps: 1
  net_arch: [256, 256]
  seed: null
  device: auto

training:
  total_episodes: 5000
  sim_steps: 1000
  logdir: results/sac_direct_bfs10
  n_workers: 1
  checkpoint_every: 50
  log_every: 10